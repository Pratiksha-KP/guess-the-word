{% extends "base.html" %}
{% block title %}Play{% endblock %}
{% block content %}

<div id="pre-game" class="panel wordle-panel">
  <p>Games left today: <strong id="games-left">{{ games_left }}</strong> / {{ max_games }}</p>
  <button id="start-btn" class="wordle-btn" {% if games_left == 0 %}disabled{% endif %}>Play</button>
  {% if games_left == 0 %}
    <p class="hint">You've used all your attempts for today. Come back tomorrow!</p>
  {% endif %}
</div>

<div id="game-board" style="display:none;">
  <div id="grid" class="grid"></div>
  <p id="attempts-left" class="attempts-left"></p>
  <p id="error-msg" class="wordle-toast" style="display:none;"></p>

  <div id="keyboard" class="keyboard"></div>

  <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false"
         class="hidden-input" maxlength="5">
</div>

<div id="result-modal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <p id="result-message"></p>
    <button id="result-ok" class="wordle-btn">OK</button>
  </div>
</div>

<script>
const MAX_GUESSES = {{ max_guesses | tojson }};
const WORD_LENGTH = {{ word_length | tojson }};
const KEY_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','BACK'],
];

let sessionId = null;
let currentRow = 0;
let currentGuess = '';
let gameOver = false;
const keyStatus = {}; // letter -> 'green' | 'orange' | 'grey'

const preGame = document.getElementById('pre-game');
const gameBoard = document.getElementById('game-board');
const grid = document.getElementById('grid');
const attemptsLeftEl = document.getElementById('attempts-left');
const errorMsg = document.getElementById('error-msg');
const startBtn = document.getElementById('start-btn');
const resultModal = document.getElementById('result-modal');
const resultMessage = document.getElementById('result-message');
const resultOk = document.getElementById('result-ok');
const keyboardEl = document.getElementById('keyboard');
const hiddenInput = document.getElementById('hidden-input');

let toastTimer = null;
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { errorMsg.style.display = 'none'; }, 1800);
  const row = document.getElementById('row-' + currentRow);
  if (row) {
    row.classList.remove('shake');
    void row.offsetWidth;
    row.classList.add('shake');
  }
}

function renderEmptyGrid() {
  grid.innerHTML = '';
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.id = 'row-' + r;
    for (let c = 0; c < WORD_LENGTH; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

function renderKeyboard() {
  keyboardEl.innerHTML = '';
  KEY_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'keyboard-row';
    row.forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'key';
      if (key === 'ENTER' || key === 'BACK') btn.classList.add('key-wide');
      btn.textContent = key === 'BACK' ? '⌫' : key;
      btn.dataset.key = key;
      if (key.length === 1 && keyStatus[key]) {
        btn.classList.add(keyStatus[key]);
      }
      btn.addEventListener('click', () => handleKey(key));
      rowEl.appendChild(btn);
    });
    keyboardEl.appendChild(rowEl);
  });
}

function updateCurrentRowDisplay() {
  for (let c = 0; c < WORD_LENGTH; c++) {
    const tile = document.getElementById(`tile-${currentRow}-${c}`);
    const letter = currentGuess[c] || '';
    tile.textContent = letter;
    if (letter) {
      tile.classList.add('filled');
    } else {
      tile.classList.remove('filled');
    }
  }
}

function handleKey(key) {
  if (gameOver) return;
  if (key === 'BACK') {
    currentGuess = currentGuess.slice(0, -1);
    updateCurrentRowDisplay();
    return;
  }
  if (key === 'ENTER') {
    submitGuess();
    return;
  }
  if (/^[A-Z]$/.test(key) && currentGuess.length < WORD_LENGTH) {
    currentGuess += key;
    updateCurrentRowDisplay();
    const tile = document.getElementById(`tile-${currentRow}-${currentGuess.length - 1}`);
    tile.classList.remove('pop');
    void tile.offsetWidth;
    tile.classList.add('pop');
  }
}

document.addEventListener('keydown', (e) => {
  if (gameBoard.style.display === 'none' || gameOver) return;
  const k = e.key;
  if (k === 'Enter') { handleKey('ENTER'); return; }
  if (k === 'Backspace') { handleKey('BACK'); return; }
  if (/^[a-zA-Z]$/.test(k)) { handleKey(k.toUpperCase()); }
});
hiddenInput.addEventListener('input', () => { hiddenInput.value = ''; });

function fillRow(rowIndex, letters, feedback) {
  letters.forEach((letter, i) => {
    const tile = document.getElementById(`tile-${rowIndex}-${i}`);
    tile.textContent = letter;
    tile.classList.add('filled');
    setTimeout(() => {
      tile.classList.add('flip', feedback[i]);
    }, i * 150);

    const prev = keyStatus[letter];
    if (feedback[i] === 'green' || (feedback[i] === 'orange' && prev !== 'green')
        || (feedback[i] === 'grey' && !prev)) {
      keyStatus[letter] = feedback[i];
    }
  });
  setTimeout(renderKeyboard, WORD_LENGTH * 150 + 100);
}

startBtn.addEventListener('click', async () => {
  const res = await fetch('/game/start', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    showError(data.error || 'Could not start game.');
    return;
  }
  sessionId = data.session_id;
  currentRow = 0;
  currentGuess = '';
  gameOver = false;
  Object.keys(keyStatus).forEach(k => delete keyStatus[k]);
  renderEmptyGrid();
  renderKeyboard();
  attemptsLeftEl.textContent = `Attempts remaining: ${data.attempts_remaining}`;
  preGame.style.display = 'none';
  gameBoard.style.display = 'block';
  hiddenInput.focus();
});

async function submitGuess() {
  if (currentGuess.length !== WORD_LENGTH) {
    showError('Not enough letters.');
    return;
  }
  const guess = currentGuess;
  const res = await fetch('/game/guess', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, guess: guess })
  });
  const data = await res.json();
  if (!res.ok) {
    showError(data.error || 'Not a valid word.');
    return;
  }

  fillRow(currentRow, data.guess.split(''), data.feedback);
  currentGuess = '';

  const revealDelay = WORD_LENGTH * 150 + 300;

  if (data.status === 'won') {
    gameOver = true;
    attemptsLeftEl.textContent = '';
    setTimeout(() => showModal("🎉 Congratulations! You guessed the word correctly!"), revealDelay);
  } else if (data.status === 'lost') {
    gameOver = true;
    attemptsLeftEl.textContent = '';
    setTimeout(() => showModal(`Better luck next time! The word was ${data.target_word}.`), revealDelay);
  } else {
    currentRow += 1;
    attemptsLeftEl.textContent = `Attempts remaining: ${data.attempts_remaining}`;
  }
}

function showModal(message) {
  resultMessage.textContent = message;
  resultModal.style.display = 'flex';
}

resultOk.addEventListener('click', () => {
  resultModal.style.display = 'none';
  gameBoard.style.display = 'none';
  preGame.style.display = 'block';
  window.location.reload();
});

{% if active_session %}
(async function resume() {
  sessionId = {{ active_session.id | tojson }};
  currentRow = {{ active_session.guesses|length | tojson }};
  gameOver = false;
  renderEmptyGrid();
  const existingGuesses = [
    {% for g in active_session.guesses %}
    { word: {{ g.guess_word | tojson }}, feedback: {{ g.feedback.split(',') | tojson }} },
    {% endfor %}
  ];
  existingGuesses.forEach((g, i) => {
    g.word.split('').forEach((letter, c) => {
      const tile = document.getElementById(`tile-${i}-${c}`);
      tile.textContent = letter;
      tile.classList.add('filled', 'flip', g.feedback[c]);
      const prev = keyStatus[letter];
      if (g.feedback[c] === 'green' || (g.feedback[c] === 'orange' && prev !== 'green')
          || (g.feedback[c] === 'grey' && !prev)) {
        keyStatus[letter] = g.feedback[c];
      }
    });
  });
  renderKeyboard();
  const remaining = MAX_GUESSES - existingGuesses.length;
  attemptsLeftEl.textContent = `Attempts remaining: ${remaining}`;
  preGame.style.display = 'none';
  gameBoard.style.display = 'block';
  hiddenInput.focus();
})();
{% endif %}
</script>
{% endblock %}
