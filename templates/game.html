{% extends "base.html" %}
{% block title %}Play{% endblock %}
{% block content %}
<h1>Guess the Word</h1>

<div id="pre-game" class="panel">
  <p>Games left today: <strong id="games-left">{{ games_left }}</strong> / {{ max_games }}</p>
  <button id="start-btn" {% if games_left == 0 %}disabled{% endif %}>Start New Word</button>
  {% if games_left == 0 %}
    <p class="hint">You've used all your attempts for today. Come back tomorrow!</p>
  {% endif %}
</div>

<div id="game-board" class="panel" style="display:none;">
  <div id="grid" class="grid"></div>

  <form id="guess-form" autocomplete="off">
    <input type="text" id="guess-input" maxlength="5" placeholder="5-letter word"
           style="text-transform:uppercase;">
    <button type="submit">Submit Guess</button>
  </form>
  <p id="attempts-left"></p>
  <p id="error-msg" class="flash error" style="display:none;"></p>
</div>

<div id="result-modal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <p id="result-message"></p>
    <button id="result-ok">OK</button>
  </div>
</div>

<script>
const MAX_GUESSES = {{ max_guesses }};
const WORD_LENGTH = {{ word_length }};

let sessionId = null;

const preGame = document.getElementById('pre-game');
const gameBoard = document.getElementById('game-board');
const grid = document.getElementById('grid');
const guessForm = document.getElementById('guess-form');
const guessInput = document.getElementById('guess-input');
const attemptsLeftEl = document.getElementById('attempts-left');
const errorMsg = document.getElementById('error-msg');
const startBtn = document.getElementById('start-btn');
const resultModal = document.getElementById('result-modal');
const resultMessage = document.getElementById('result-message');
const resultOk = document.getElementById('result-ok');

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}
function clearError() {
  errorMsg.style.display = 'none';
}

function renderEmptyGrid() {
  grid.innerHTML = '';
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.id = 'row-' + r;
    for (let c = 0; c < WORD_LENGTH; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

function fillRow(rowIndex, letters, feedback) {
  const row = document.getElementById('row-' + rowIndex);
  const tiles = row.querySelectorAll('.tile');
  letters.forEach((letter, i) => {
    tiles[i].textContent = letter;
    tiles[i].classList.add(feedback[i]); // 'green' | 'orange' | 'grey'
  });
}

startBtn.addEventListener('click', async () => {
  clearError();
  const res = await fetch('/game/start', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    showError(data.error || 'Could not start game.');
    return;
  }
  sessionId = data.session_id;
  renderEmptyGrid();
  attemptsLeftEl.textContent = `Attempts remaining: ${data.attempts_remaining}`;
  preGame.style.display = 'none';
  gameBoard.style.display = 'block';
  guessInput.value = '';
  guessInput.focus();
});

guessForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const guess = guessInput.value.trim().toUpperCase();
  if (guess.length !== WORD_LENGTH || !/^[A-Z]+$/.test(guess)) {
    showError('Please enter a valid 5-letter word (letters only).');
    return;
  }

  const res = await fetch('/game/guess', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, guess: guess })
  });
  const data = await res.json();
  if (!res.ok) {
    showError(data.error || 'Something went wrong.');
    return;
  }

  const rowIndex = MAX_GUESSES - data.attempts_remaining - 1;
  fillRow(rowIndex, data.guess.split(''), data.feedback);
  guessInput.value = '';

  if (data.status === 'won') {
    attemptsLeftEl.textContent = '';
    showModal("🎉 Congratulations! You guessed the word correctly!");
  } else if (data.status === 'lost') {
    attemptsLeftEl.textContent = '';
    showModal(`Better luck next time! The word was ${data.target_word}.`);
  } else {
    attemptsLeftEl.textContent = `Attempts remaining: ${data.attempts_remaining}`;
    guessInput.focus();
  }
});

function showModal(message) {
  resultMessage.textContent = message;
  resultModal.style.display = 'flex';
}

resultOk.addEventListener('click', () => {
  resultModal.style.display = 'none';
  gameBoard.style.display = 'none';
  preGame.style.display = 'block';
  // Refresh games-left counter by reloading the page (keeps daily-limit logic on server)
  window.location.reload();
});

{% if active_session %}
// Resume an in-progress game (e.g. after a page refresh)
(async function resume() {
  sessionId = {{ active_session.id }};
  renderEmptyGrid();
  const existingGuesses = [
    {% for g in active_session.guesses %}
    { word: "{{ g.guess_word }}", feedback: "{{ g.feedback }}".split(',') },
    {% endfor %}
  ];
  existingGuesses.forEach((g, i) => fillRow(i, g.word.split(''), g.feedback));
  const remaining = MAX_GUESSES - existingGuesses.length;
  attemptsLeftEl.textContent = `Attempts remaining: ${remaining}`;
  preGame.style.display = 'none';
  gameBoard.style.display = 'block';
})();
{% endif %}
</script>
{% endblock %}
