{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="POST" class="form-card">
  <label>Username</label>
  <input type="text" name="username" required>

  <label>Password</label>
  <input type="password" name="password" required>

  <button type="submit">Login</button>
</form>
<p>New here? <a href="{{ url_for('register') }}">Register</a></p>
<div class="panel">
    <strong>Admin Access</strong>
    <p>
        To access the Admin Dashboard, log in using the
        administrator credentials provided with this project.
    </p>
    <p>
        <strong>Username:</strong> AdminUser<br>
        <strong>Password:</strong> Admin1$
    </p>
</div>
{% endblock %}
